[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-workspace"
version = "0.1.0"
description = "AIO Agent Workspace - metal multi-agent pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "httpx>=0.28.0",
  "typer>=0.15.0",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "textual>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=1.0.0"]

[project.scripts]
aio = "app.cli_pkg.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
